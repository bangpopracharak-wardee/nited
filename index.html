<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>โรงเรียนนราศึกษา - ยินดีต้อนรับ</title>
  <style>
    :root{
      --blue-100:#e6f0fb;
      --blue-300:#4da3ff;
      --blue-600:#0b63b7;
      --text:#012139;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto, "Noto Sans", "Helvetica Neue", Arial;
      background: linear-gradient(180deg,var(--blue-100),#ffffff 70%);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2rem;
    }
    .card{
      width:100%;
      max-width:920px;
      background:linear-gradient(135deg, rgba(77,163,255,0.12), rgba(11,99,183,0.06));
      border:1px solid rgba(11,99,183,0.12);
      border-radius:16px;
      padding:2.25rem;
      box-shadow:0 8px 24px rgba(3,44,92,0.08);
      text-align:center;
    }
    .logo{
      width:96px;height:96px;border-radius:12px;margin:0 auto 1rem;
      background:linear-gradient(135deg,var(--blue-300),var(--blue-600));
      display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:28px;
      box-shadow:0 6px 18px rgba(11,99,183,0.18);
    }
    h1{margin:0 0 0.5rem;font-size:1.75rem}
    p.lead{margin:0 0 1.25rem;color:rgba(1,33,57,0.82)}
    .actions{display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
    .btn{
      display:inline-flex;align-items:center;gap:0.6rem;padding:0.75rem 1.1rem;border-radius:10px;border:0;font-weight:600;cursor:pointer;text-decoration:none;color:white;background:var(--blue-600);
      box-shadow:0 6px 12px rgba(11,99,183,0.16);
    }
    .btn.secondary{background:transparent;color:var(--blue-600);border:2px solid rgba(11,99,183,0.12)}
    footer{margin-top:1.5rem;font-size:0.9rem;color:rgba(1,33,57,0.6)}
    @media (max-width:520px){.card{padding:1.25rem}.logo{width:72px;height:72px}}
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="logo" aria-hidden="true">นร</div>
    <h1>ยินดีต้อนรับสู่โรงเรียนนราศึกษา</h1>
    <p class="lead">โรงเรียนนราศึกษา อำเภอเมืองนราธิวาส จังหวัดนราธิวาส</p>

    <p>ยินดีต้อนรับผู้มาเยือนทุกท่าน โปรดใช้ปุ่มด้านล่างเพื่อเข้าสู่ระบบนิเทศออนไลน์ของโรงเรียน</p>

    <div class="actions">
      <a class="btn" href="/online-supervision" title="เข้าสู่ระบบนิเทศออนไลน์">เข้าสู่ระบบนิเทศออนไลน์</a>
      <a class="btn secondary" href="#" title="ข้อมูลติดต่อ">ติดต่อโรงเรียน</a>
    </div>

    <footer>
      <div>หากลิงก์ระบบนิเทศออนไลน์ไม่ทำงาน โปรดติดต่อผู้ดูแลระบบของโรงเรียน</div>
    </footer>
  </main>
</body>
</html>
